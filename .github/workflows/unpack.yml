name: Unpack AuraCheck
on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  unpack:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Unpack final app
        shell: bash
        run: |
          test -f auracheck.tar.gz
          rm -rf .stage
          mkdir .stage
          tar -xzf auracheck.tar.gz -C .stage
          shopt -s dotglob nullglob
          cp -R .stage/AuraCheck/* .
          rm -rf .stage auracheck.tar.gz .deploy-trigger .github/workflows/unpack.yml

      - name: Commit app files
        shell: bash
        run: |
          git config user.name "AuraCheck Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Deploy AuraCheck app" || exit 0
          git push origin HEAD:${{ github.head_ref }}
