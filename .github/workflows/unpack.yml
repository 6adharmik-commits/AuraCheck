name: Unpack AuraCheck
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  unpack:
    if: contains(github.event.head_commit.message, 'Stage AuraCheck archive')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack final app
        shell: bash
        run: |
          rm -rf .stage
          mkdir .stage
          tar -xzf auracheck.tar.gz -C .stage
          shopt -s dotglob nullglob
          cp -R .stage/AuraCheck/* .
          rm -rf .stage auracheck.tar.gz
      - name: Commit app files
        shell: bash
        run: |
          git config user.name "AuraCheck Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Deploy AuraCheck app" || exit 0
          git push
